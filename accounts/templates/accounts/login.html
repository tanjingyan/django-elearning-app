{% extends "base.html" %}

{% block title %}
    Login
{% endblock %}


{% block content %}

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-5">

            <div class="card content-card">

                <div class="card-body p-4 p-md-5">

                    <!-- =================================================
                         HEADER
                         ================================================= -->

                    <div class="text-center mb-4">

                        <div class="display-5 mb-3">
                            🎓
                        </div>

                        <h1 class="page-heading">
                            Welcome Back
                        </h1>

                        <p class="page-subheading mb-0">
                            Log in to continue to LearnSpace.
                        </p>

                    </div>


                    <!-- =================================================
                         LOGIN ERROR
                         ================================================= -->

                    {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                    {% endif %}


                    <!-- =================================================
                         LOGIN FORM
                         ================================================= -->

                    <form method="post">

                        {% csrf_token %}


                        <!-- =============================================
                             USERNAME
                             ============================================= -->

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                id="username"
                                name="username"
                                type="text"
                                class="form-control"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <!-- =============================================
                             PASSWORD
                             ============================================= -->

                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>


                            <div class="input-group">

                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >


                                <!-- Show / Hide Password -->

                                <button
                                    type="button"
                                    id="togglePassword"
                                    class="btn btn-outline-secondary password-toggle"
                                    aria-label="Show password"
                                    title="Show password"
                                >

                                    <svg
                                        id="eyeIcon"
                                        xmlns="http://www.w3.org/2000/svg"
                                        width="18"
                                        height="18"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <path
                                            d="M2 12s3.5-7 10-7
                                               10 7 10 7
                                               -3.5 7-10 7
                                               S2 12 2 12"
                                        >
                                        </path>

                                        <circle
                                            cx="12"
                                            cy="12"
                                            r="3"
                                        >
                                        </circle>

                                    </svg>

                                </button>

                            </div>

                        </div>


                        <!-- =============================================
                             LOGIN BUTTON
                             ============================================= -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <!-- =================================================
                         REGISTER LINK
                         ================================================= -->

                    <p class="text-center text-muted mt-4 mb-0">

                        Do not have an account?

                        <a
                            href="{% url 'register' %}"
                            class="text-decoration-none fw-semibold"
                        >
                            Register
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================================================
         PAGE STYLING
         ========================================================= -->

    <style>

        .password-toggle {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 48px;

            color: #6c757d;

            background-color: #ffffff;

            border-color: #ced4da;
        }


        .password-toggle:hover {
            color: #0d6efd;

            background-color: #f8f9fa;

            border-color: #86b7fe;
        }


        .password-toggle:focus {
            box-shadow:
                0 0 0 0.25rem
                rgba(13, 110, 253, 0.25);
        }


        .password-toggle svg {
            pointer-events: none;
        }

    </style>



    <!-- =========================================================
         PASSWORD VISIBILITY SCRIPT
         ========================================================= -->

    <script>

        const passwordInput =
            document.getElementById("password");

        const togglePasswordButton =
            document.getElementById("togglePassword");

        const eyeIcon =
            document.getElementById("eyeIcon");


        togglePasswordButton.addEventListener(
            "click",
            function () {

                const passwordIsHidden =
                    passwordInput.type === "password";


                if (passwordIsHidden) {

                    /* Show password */

                    passwordInput.type = "text";

                    togglePasswordButton.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                    togglePasswordButton.setAttribute(
                        "title",
                        "Hide password"
                    );


                    /* Eye-off icon */

                    eyeIcon.innerHTML = `
                        <path d="M3 3l18 18"></path>

                        <path
                            d="M10.6 10.6
                               a2 2 0 0 0
                               2.8 2.8"
                        ></path>

                        <path
                            d="M9.9 4.2
                               A10.8 10.8 0 0 1
                               12 4
                               c6.5 0
                               10 8
                               10 8
                               a18.6 18.6 0 0 1
                               -2.2 3.2"
                        ></path>

                        <path
                            d="M6.6 6.6
                               C3.6 8.6
                               2 12
                               2 12
                               s3.5 8
                               10 8
                               c1.5 0
                               2.8-.4
                               4-.9"
                        ></path>
                    `;

                } else {

                    /* Hide password */

                    passwordInput.type = "password";

                    togglePasswordButton.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                    togglePasswordButton.setAttribute(
                        "title",
                        "Show password"
                    );


                    /* Normal eye icon */

                    eyeIcon.innerHTML = `
                        <path
                            d="M2 12
                               s3.5-7
                               10-7
                               10 7
                               10 7
                               -3.5 7
                               -10 7
                               S2 12
                               2 12"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>
                    `;

                }

            }
        );

    </script>

{% endblock %}
