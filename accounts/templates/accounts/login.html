{% extends "base.html" %}

{% block title %}
    Login
{% endblock %}

{% block content %}

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-5">

            <div class="card content-card">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <div class="display-5 mb-3">
                            🎓
                        </div>

                        <h1 class="page-heading">
                            Welcome Back
                        </h1>

                        <p class="page-subheading mb-0">
                            Log in to continue to LearnSpace.
                        </p>

                    </div>


                    {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                    {% endif %}


                    <form method="post">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                id="username"
                                name="username"
                                type="text"
                                class="form-control"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                id="password"
                                name="password"
                                type="password"
                                class="form-control"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <p class="text-center text-muted mt-4 mb-0">

                        Do not have an account?

                        <a
                            href="{% url 'register' %}"
                            class="text-decoration-none fw-semibold"
                        >
                            Register
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

{% endblock %}
