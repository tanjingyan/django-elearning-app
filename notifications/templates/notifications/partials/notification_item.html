<div
    class="col-12"
    id="notification-{{ notification.id }}"
>

    <div
        class="
            card
            content-card
            {% if not notification.is_read %}
                border-primary
            {% endif %}
        "
    >

        <div class="card-body">

            <div class="d-flex gap-3">

                <div
                    class="
                        rounded-circle
                        {% if notification.is_read %}
                            bg-secondary-subtle
                            text-secondary
                        {% else %}
                            bg-primary-subtle
                            text-primary
                        {% endif %}
                        d-flex
                        align-items-center
                        justify-content-center
                        flex-shrink-0
                    "
                    style="
                        width: 52px;
                        height: 52px;
                        font-size: 1.3rem;
                    "
                >
                    🔔
                </div>


                <div class="flex-grow-1">

                    <div
                        class="
                            d-flex
                            justify-content-between
                            align-items-start
                            gap-3
                        "
                    >

                        <p class="fw-semibold mb-1">
                            {{ notification.message }}
                        </p>


                        {% if notification.is_read %}

                            <span
                                class="
                                    badge
                                    text-bg-light
                                    flex-shrink-0
                                "
                            >
                                Read
                            </span>

                        {% else %}

                            <span
                                class="
                                    badge
                                    text-bg-primary
                                    flex-shrink-0
                                "
                            >
                                New
                            </span>

                        {% endif %}

                    </div>


                    <p class="text-muted small mb-3">
                        {{ notification.created_at|date:"d M Y, g:i A" }}
                    </p>


                    <div class="d-flex gap-2 flex-wrap">

                        {% if notification.course %}

                            <a
                                href="{% url 'course_detail' notification.course.id %}"
                                class="btn btn-outline-primary btn-sm"
                            >
                                View Course
                            </a>

                        {% endif %}


                        {% if not notification.is_read %}

                            <form
                                method="post"
                                hx-post="{% url 'mark_notification_read' notification.id %}"
                                hx-target="#notification-{{ notification.id }}"
                                hx-swap="outerHTML"
                            >

                                {% csrf_token %}

                                <button
                                    type="submit"
                                    class="btn btn-outline-secondary btn-sm"
                                >
                                    Mark as Read
                                </button>

                            </form>

                        {% else %}

                            <span
                                class="
                                    text-success
                                    small
                                    d-flex
                                    align-items-center
                                "
                            >
                                ✓ Read
                            </span>

                        {% endif %}

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
