{% extends "base.html" %}


{% block title %}
    Edit Course
{% endblock %}


{% block content %}

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card content-card">

                <div class="card-body p-4">

                    <h1 class="page-heading">
                        Edit Course
                    </h1>

                    <p class="page-subheading">
                        Update the course details and cover image.
                    </p>


                    {% if course.image %}

                        <div class="mb-4">

                            <p class="fw-semibold mb-2">
                                Current cover image
                            </p>

                            <img
                                src="{{ course.image.url }}"
                                alt="{{ course.title }}"
                                class="img-fluid rounded"
                                style="
                                    width: 100%;
                                    max-height: 300px;
                                    object-fit: cover;
                                "
                            >

                        </div>

                    {% endif %}


                    <form
                        method="post"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                        <a
                            href="{% url 'course_detail' course.id %}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

{% endblock %}
